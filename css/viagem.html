<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Da Garagem até o Mar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="travel-hero">

    <div class="travel-overlay"></div>

    <div class="container">

        <div class="travel-content">

            <span class="travel-tag">
                🚙 CAPÍTULO EXTRA
            </span>

            <h1>
                Da garagem<br>
                até o mar
            </h1>

            <p class="lead">

                Toda grande viagem começa muito antes da primeira praia.

                Ela começa quando a chave gira,
                o porta-malas fecha
                e a estrada chama.

            </p>

            <div class="travel-info">

                <div>
                    <strong>📍 Origem</strong>
                    <span>Cascavel • PR</span>
                </div>

                <div>
                    <strong>🏖️ Destino</strong>
                    <span>Praia da Pinheira • SC</span>
                </div>

                <div>
                    <strong>🛣️ Distância</strong>
                    <span>aprox. 790 km</span>
                </div>

                <div>
                    <strong>⏱️ Tempo</strong>
                    <span>10h30</span>
                </div>

            </div>

        </div>

    </div>

</section>
